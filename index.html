<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Drive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="speed-card">
    <div id="speed-value">0</div>
    <div id="speed-label">km/h</div>
  </div>

  <div id="button-panel">
    <button id="btn-reset">Reset Layout</button>
  </div>

  <div id="camera-hint">Drag to look around</div>

  <div id="loading-screen">
    <div id="loading-text">Loading world...</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
